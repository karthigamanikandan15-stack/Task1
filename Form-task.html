<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title>Document</title>
    <style>
        *{
        Margin:0px;
        padding:0px;
        box-sizing: border-box;
    }
    .main{
        width: 400px;
        height: 550px;
        background: linear-gradient(rgba(3, 41, 78),rgba(5, 95, 57));
        margin: 50px auto;
    }
    .top
    {
        width:100%;
        height: 30%;
        /* background-color: yellowgreen; */
        text-align: center;
        position: relative;
    }
    img{
        /* background-color: pink; */
        width:50px;
        height:50px;
        border-radius:50px;
        border: 2px solid blue;
        margin-top: 50px;
    }
    h1{
        color: white;
        font-size: 20px;
    }
    .bottom{
        width:100%;
        height: 70%;
        /* background-color: blueviolet; */
    }
    .label{
        color: white;
        display: block;
        font-size: 20px;
        margin-bottom: 11px;
        margin-left: 20px;
        margin-top: 5px;
        padding: 2px;
    }
    .input{
        border-radius: 15px;
        margin-left: 20px;
        width: 90%;
        height: 30px;
    }
    .form button{
        border-radius: 15px;
        margin-left: 20px;
        width: 90%;
        height: 30px;
        background-color: yellow;
    }
    #street{
        color: white;
        font-size: 10px;
    }
    #line{
        color: white;
        font-size: 10px;
    }
    #city{
        color: white;
        font-size: 10px;
    }
    .browser-dots {
    position: absolute;
    top: 13px;
    left: 18px;
    display: flex;
    gap: 4px;
}

.dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    display: block;
}

.red {
    background-color: red;
}

.yellow {
    background-color: yellow;
}

.green {
    background-color: green;
}
@media screen and (max-width: 450px) {

    .main {
        width: 100%;
        height: 550px;
        margin: auto;
    }

    .top {
        height: 30%;
    }

    img {
        width: 45px;
        height: 45px;
        margin-top: 40px;
    }

    h1 {
        font-size: 18px;
    }

    .label {
        font-size: 14px;
        margin-left: 20px;
    }

    .input {
        width: 85%;
        height: 30px;
        margin-left: 20px;
    }

    .form button {
        width: 85%;
        height: 30px;
        margin-left: 20px;
    }

    .browser-dots {
        top: 13px;
        left: 18px;
    }
}

</style>
</head>
<body>
    <span id="head"   style="background-color: brown; border-radius: 60px;"><i class="fa-solid fa-xmark"></i></span>
    </button>id="form"
    <form action="" >
    <div class="main">
     <div class="top">
        <div class=" browser-dots">
            <span class="dot red"></span>
             <span class="dot yellow"></span>
              <span class="dot green"></span>
        </div>
        <div class="logo">
           <img src="../First day/worker Logo.png" alt="">
        </div>
        <h1>On-Site Enquiries Form</h1>
        </div>
        <div class="bottom">
        <div class="form">
        <label for="" class="label">Name <span style="color:red">*</span> </label>
        <input type="text" class="input">
        </div>
        <div class="form">
        <label for="" class="label">Where are you? <span style="color:red">*</span> </label>
        <input type="text" class="input">
        <label for="" class="label" id="street">Street Address<Address></Address></label>
        </div>
        <div class="form">
        <input type="text" class="input">
        <label for="" class="label" id="line">Address Line 2</label>
        </div>
         <div class="form">
        <input type="text" class="input">
        <label for="" class="label" id="city">City</label>
        </div>
        <div class="form">
        <button> <b> Submit </b> </button>
        </div>
        </div>
        </div>
        </div>
    </div>
    </form>
    
</body> 
</html>
