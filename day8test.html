<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 <style>
        body {
            font-family: Arial;
            display: flex;
            gap: 50px;
            padding: 40px;
        }

        .input-container {
            width: 300px;
            padding: 20px;
            border: 1px solid black;
        }

        .result-container {
            width: 300px;
            padding: 20px;
            border: 1px solid black;
        }

        input {
            width: 90%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 10px 20px;
            margin: 10px 5px 0 0;
            cursor: pointer;
        }

        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- LEFT SIDE -->
    <div class="input-container">

        <h2>Student Marks</h2>

        <label>Student Name:</label>
        <input type="text" id="studentName">

        <label>Subject 1:</label>
        <input type="number" id="mark1">

        <label>Subject 2:</label>
        <input type="number" id="mark2">

        <label>Subject 3:</label>
        <input type="number" id="mark3">

        <br>

        <button onclick="calculate()">CALCULATE</button>

        <button onclick="submitResult()">SUBMIT</button>

    </div>


    <!-- RIGHT SIDE -->
    <div class="result-container">

        <h2>Student Result</h2>

        <p>Name: <span id="resultName"></span></p>

        <p>Sum: <span id="resultSum"></span></p>

        <p>Average: <span id="resultAverage"></span></p>

        <p>Percentage: <span id="resultPercentage"></span>%</p>

    </div>


    <script>

        // Variables to store calculated values
        let total = 0;
        let average = 0;
        let percentage = 0;


        // CALCULATE BUTTON
        function calculate() {

            // Get values using document.getElementById()
            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);

            // + operator
            total = mark1 + mark2 + mark3;

            // / operator
            average = total / 3;

            // * operator
            // Total marks = 300
            percentage = (total / 300) * 100;

            // Display calculated values
            document.getElementById("resultSum").innerHTML = total;

            document.getElementById("resultAverage").innerHTML =
                average.toFixed(2);

            document.getElementById("resultPercentage").innerHTML =
                percentage.toFixed(2);
        }


        // SUBMIT BUTTON
        function submitResult() {

            // Get student name
            let name = document.getElementById("studentName").value;

            // Show name in right container
            document.getElementById("resultName").innerHTML = name;

            // Show calculated values
            document.getElementById("resultSum").innerHTML = total;

            document.getElementById("resultAverage").innerHTML =
                average.toFixed(2); 

            document.getElementById("resultPercentage").innerHTML =
                percentage.toFixed(2);
        }

    </script>

</body>
</html>`1
