<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=d, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Document</title>
    <style>
        *,*::after,*::before{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        p{
           font-size: 50px;
            margin-top: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        nav{
            background-color: black;
            width: 100%;
            height: 10vh;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: relative;
        }
        .ul{
            background-color: aqua;
            padding: 5px;
            font-size: 20px;
            display: flex;
            align-items: center;
            height: 100%;
            width: 800 px;
            margin-left: 10px;
        }
        .li{
            background-color: blueviolet;
            margin-left: 50px;
            list-style-type:none;
            padding: 5px 5px;
        }
        
        .Logo{
            background-color: red;
            /* white-space:nowrap; */
            width: 300px;
            height: 100%;
            font-size: 30px;
            font-family: 'Times New Roman', Times, serif;
            color: white;
            display: flex;
            justify-content: start;
            align-items: center;
            margin-left: 10px;
        }
        @media screen and (max-width:425px){
            nav{
                position: relative;
            }
            .ul{
                position: absolute;
                top: 10vh;
                width: 100%;
                height: auto;
                display: block;
            }
            p{
                position: absolute;
                top: 30vh;
            }
        }
        span{
            background-color: beige;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 20px;
        }

    </style>
</head>
<body>
    <nav>
       
        <div class="Logo">
            Lakshmi Steels
            </div>
            <ul class="ul" id="ul">
              <li class="li"> <a href="" class="link">Home</a> </li>
              <li class="li"> <a href="" class="link">About</a> </li>
              <li class="li"> <a href="" class="link">Contact</a> </li>
              <li class="li"> <a href="" class="link">Others</a> </li>
            </ul>
             <span><i class="fa-solid fa-bars" onclick="toggle()"></i></span>
             <script>
                let toggled=false;
                function toggle(){
                    if(!toggled){
                        toggled=true;
                    
                    document.getElementById("ul").style.left="0%";
                    return
                }
             
                if(toggled){
                    toggled=false;
                    document.getElementById("ul").style.left="-100%";
                    return
                }
             } 
             </script>
    </nav>
    <p> Welcome to our Shop<p>
</body>
</html>
