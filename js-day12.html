<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" 
     integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <title></title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7ff;
            padding: 30px 15px;
            color: #10234a;
        }

        .main {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(25, 60, 120, 0.15);
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .content {
            width: 60%;
        }

        .heading {
            display: block;
            background: #e3edff;
            color: #075acb;
            padding: 8px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            line-height: 1.15;
            margin-bottom: 18px;
        }

        .details {
            color: #374151;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 22px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 35px;
        }

        .btn {
            text-decoration: none;
            padding: 14px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            display: block;
            text-align: center;
            transition: 0.3s;
        }

        .button1 {
            background: #0866f5;
            color: white;
            border: 2px solid #0866f5;
        }

        .button2 {
            color: #0866d9;
            border: 2px solid #0866d9;
            background: white;
        }

        .play-icon {
            font-size: 14px;
            margin-right: 5px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 12px rgba(0, 70, 180, 0.2);
        }

        .footer {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .foot {
            flex: 1;
            text-align: center;
            border-right: 1px solid #d6dce8;
            padding: 5px;
        }

        .foot:last-child {
            border-right: none;
        }

        .foot h2 {
            color: #0866d9;
            font-size: 27px;
            margin-bottom: 5px;
        }

        .foot p {
            font-size: 14px;
            color: #27364d;
        }

        .image {
            width: 40%;
        }

        .image img {
            display: block;
            width: 100%;
            height: 390px;
            object-fit: cover;
            border-radius: 12px;
        }

        @media screen and (max-width: 768px) {

            .main {
                width: 90%;
                flex-direction: column;
                align-items: stretch;
                padding: 30px;
                gap: 25px;
            }

            .content,
            .image {
                width: 100%;
            }

            h1 {
                font-size: 38px;
            }

            .image img {
                height: 220px;
            }
        }
         @media screen and (max-width: 991px) {

            .main {
                width: 90%;
                flex-direction: column;
                align-items: stretch;
                padding: 30px;
                gap: 25px;
            }

            .content,
            .image {
                width: 100%;
            }

            h1 {
                font-size: 38px;
            }

            .image img {
                height: 220px;
            }
        }

    </style>
</head>

<body>

    <div class="main">

        <div class="content">

            <span class="heading">Welcome to EduTech</span>

            <h1>
                Learn Today<br>
                Build Tomorrow
            </h1>

            <p class="details">
                Join thousands of students and develop
                real-world skills with expert-led courses.
            </p>

            <div class="buttons">

                <button type="button" class="btn button1">
                    Get Started 
                </button>

                <button type="button" class="btn button2">
                    <span class="play-icon"><i class="fa-solid fa-square-caret-right"></i></span>
                    Watch Video
                </button>

            </div>

            <div class="footer">

                <div class="foot">
                    <h2>10K+</h2>
                    <p>Students</p>
                </div>

                <div class="foot">
                    <h2>50+</h2>
                    <p>Courses</p>
                </div>

                <div class="foot">
                    <h2>95%</h2>
                    <p>Success Rate</p>
                </div>

            </div>

        </div>
        <div class="image">

            <img
                src="./New/WhatsApp Image 2026-10-12 at 12.34.00 AM.jpeg"
                alt="Online learning with laptop">

        </div>

    </div>

</body>

</html>
