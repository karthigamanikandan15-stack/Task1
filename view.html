<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Responsive Cards</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


.main{
    max-width:1000px;
    margin:auto;
    background:white;
    padding:15px;
    border-radius:15px;
}

.lap img{
    width:100%;
    height:300px;
    object-fit:cover;
    border-radius:15px;
}

.designs{
    display:flex;
    gap:15px;
    /* margin-top:15px; */
    flex:1 1;
}

.web{
    flex:1 1;
    background:#f5f5f5;
    padding:20px;
    border-radius:15px;
}

.web h2{
    color:#0b3558;
    margin-bottom:10px;
}

.web p{
    color:#555;
    line-height:1.5;
    margin-bottom:15px;
}

button{
    width: 120px;
    background:#0b3558;
    color:white;
    padding:10px 10px;
    border-radius:9px;
    
}




@media(min-width:1024px){

    .main{
        max-width:1000px;
        padding:30px;
        gap:25px;
        display: flex;
        margin-top: 100px;
    }

    .lap{
        width:40%;
        height:auto;
    }


    .designs{
        width:60%;
        gap:25px;
    }

    .web{
        height:auto;
        padding:30px;
        display:flex;
        flex-direction:column;
        justify-content:center;
    }

}


@media(max-width:768px){

     .main{
        max-width:1000px;
        padding:30px;
        gap:20px;
    }

    .lap{
        width:100%;
        height:auto;
    }


    .designs{
        width:100%;
        margin-top:25px;
        gap:25px;
    }

    .web{
        height:200px;
        padding:25px;
        display:flex;
        flex-direction:column;
        justify-content:center;
    }

}


@media(max-width:450px){

    .main {
        width: 100%;
        padding: 10px;
    }

    .lap {
        width: 100%;
        height: auto;
    }

    .lap img {
        width: 100%;
        height: 145px;
        object-fit: cover;
        border-radius: 12px;
    }

    .designs {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 10px;
    }

    .web {
        width: 100%;
        height: auto;
        padding: 15px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

}

</style>
</head>

<body>

<div class="main">

    <div class="lap">
        <img src="./Laptop.jpeg" alt="">
    </div>

    <div class="designs">

        <div class="web">

            <h2>Web Development</h2>

            <p>
                Learn HTML, CSS and JavaScript with practical projects
                and responsive website development.
            </p>
             <button>Learn More</button>

        </div>

        <div class="web">

            <h2>Responsive Design</h2>

            <p>
                Create websites that automatically adjust their layout
                according to desktop, tablet and mobile screens.
            </p>

            <button> Explore </button>

        </div>

    </div>

</div>

</body>
</html>
